name: EAS Hot Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update channel'
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      message:
        description: 'Update message'
        required: true
        type: string
      publication_mode:
        description: 'coordinated waits for APK + IPA; ota-first publishes OTA immediately for emergencies'
        required: true
        default: coordinated
        type: choice
        options:
          - coordinated
          - ota-first

permissions:
  contents: write
  actions: write

concurrency:
  group: eas-hot-update-${{ inputs.channel }}
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Prepare OTA
    runs-on: ubuntu-latest
    outputs:
      runtime_version: ${{ steps.update-config.outputs.runtime_version }}
      update_url: ${{ steps.update-config.outputs.update_url }}
      ota_release_json: ${{ steps.ota-release.outputs.release }}
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ vars.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      EXPO_UPDATE_CHANNEL: ${{ inputs.channel }}
      APP_CONTENT_REVISION: ${{ github.sha }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo 'EAS updates must be dispatched from the main branch.'
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Configure update channel
        shell: bash
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo 'EXPO_TOKEN is not configured.'
            exit 1
          fi
          if [[ -z "$EXPO_PROJECT_ID" ]]; then
            echo 'EXPO_PROJECT_ID is not configured.'
            exit 1
          fi

          if [[ "$EXPO_UPDATE_CHANNEL" == "preview" ]]; then
            manifest_path='docs/releases/preview.json'
          else
            manifest_path='docs/releases/latest.json'
          fi

          if [[ ! -f "$manifest_path" ]]; then
            echo "No released APK manifest exists for channel $EXPO_UPDATE_CHANNEL: $manifest_path"
            echo 'Publish the matching full APK before publishing a hot update.'
            exit 1
          fi

          app_version="$(npx expo config --type public --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version));')"
          released_version="$(node -e 'const fs = require("fs"); const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(manifest.version ?? ""));' "$manifest_path")"
          released_display_version="$(node -e 'const fs = require("fs"); const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(manifest.displayVersion ?? manifest.version ?? ""));' "$manifest_path")"
          if [[ "$app_version" != "$released_version" ]]; then
            echo "Hot update runtime version $app_version does not match the latest $EXPO_UPDATE_CHANNEL APK version $released_version."
            echo 'Publish the matching full APK or restore app.config.ts version before publishing a hot update.'
            exit 1
          fi

          echo "EAS_ENVIRONMENT=$EXPO_UPDATE_CHANNEL" >> "$GITHUB_ENV"
          echo "APP_NATIVE_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "Publishing Android and iOS appVersion=$app_version, release=$released_display_version to channel=$EXPO_UPDATE_CHANNEL"

      - name: Validate Expo update config
        id: update-config
        shell: bash
        run: |
          npx expo config --type public --json | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const config = JSON.parse(input);
              const expectedChannel = process.env.EXPO_UPDATE_CHANNEL;
              const actualChannel = config.updates?.requestHeaders?.["expo-channel-name"];
              const configuredChannel = config.extra?.updateChannel;
              const appUpdatesEnabled = config.extra?.appUpdatesEnabled;
              const manifestUrl = config.extra?.binaryUpdateManifestUrl;
              if (!config.updates?.url) throw new Error("Expo updates.url is missing");
              if (config.updates?.enabled !== true) throw new Error("Expo updates are disabled");
              if (actualChannel !== expectedChannel) throw new Error(`Expected update channel ${expectedChannel}, got ${actualChannel}`);
              if (configuredChannel !== expectedChannel) throw new Error(`Expected configured channel ${expectedChannel}, got ${configuredChannel}`);
              if (appUpdatesEnabled !== true) throw new Error("App update checks are disabled");
              if (typeof config.runtimeVersion !== "string" || !config.runtimeVersion) throw new Error("An explicit OTA runtime is required");
              if (config.extra?.contentRevision !== process.env.GITHUB_SHA) throw new Error("OTA content revision must match the workflow source commit");
              if (expectedChannel === "preview" && !manifestUrl?.endsWith("/docs/releases/preview.json")) {
                throw new Error(`Preview build uses an invalid binary manifest: ${manifestUrl}`);
              }
              if (expectedChannel === "production" && manifestUrl?.endsWith("/docs/releases/preview.json")) {
                throw new Error(`Production build uses the preview binary manifest: ${manifestUrl}`);
              }
              require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `runtime_version=${config.runtimeVersion}\nupdate_url=${config.updates.url}\n`);
            });
          '

      - name: Check for an unfinished OTA release
        id: ota-preflight
        env:
          OTA_UPDATE_URL: ${{ steps.update-config.outputs.update_url }}
          OTA_RUNTIME_VERSION: ${{ steps.update-config.outputs.runtime_version }}
          OTA_CHANNEL: ${{ inputs.channel }}
          OTA_SOURCE_SHA: ${{ github.sha }}
          OTA_PUBLICATION_MODE: ${{ inputs.publication_mode }}
        run: node scripts/ota-release.cjs preflight

      - name: Upload OTA candidate or publish emergency OTA
        if: steps.ota-preflight.outputs.resume != 'true'
        shell: bash
        run: |
          reserved_marker='<!--[[:space:]]*anitabi-(ota-run|ota-release|build-number):'
          if [[ "$INPUT_MESSAGE" =~ $reserved_marker ]]; then
            echo 'Update message cannot contain reserved release metadata.'
            exit 1
          fi
          # Keep an ownership marker in EAS metadata so a retry after upload can
          # recover this run's candidate even if recording its output failed.
          printf -v update_message '%s\n\n<!-- anitabi-ota-run: %s; mode: %s -->' "$INPUT_MESSAGE" "$GITHUB_RUN_ID" "$PUBLICATION_MODE"
          update_args=(update --channel "$EXPO_UPDATE_CHANNEL" --environment "$EAS_ENVIRONMENT" --platform all --message "$update_message" --non-interactive --json)
          if [[ "$PUBLICATION_MODE" == "coordinated" ]]; then
            update_args+=(--rollout-percentage 0)
          fi
          npx eas-cli@21.8.0 "${update_args[@]}" > ota-update.json
        env:
          INPUT_MESSAGE: ${{ inputs.message }}
          PUBLICATION_MODE: ${{ inputs.publication_mode }}

      - name: Record and verify exact OTA identities
        id: ota-release
        env:
          OTA_UPDATE_URL: ${{ steps.update-config.outputs.update_url }}
          OTA_RUNTIME_VERSION: ${{ steps.update-config.outputs.runtime_version }}
          OTA_CHANNEL: ${{ inputs.channel }}
          OTA_SOURCE_SHA: ${{ github.sha }}
          OTA_PUBLICATION_MODE: ${{ inputs.publication_mode }}
          OTA_RESUME: ${{ steps.ota-preflight.outputs.resume }}
        run: node scripts/ota-release.cjs capture ota-update.json

      - name: Save OTA release state
        env:
          OTA_RELEASE_JSON: ${{ steps.ota-release.outputs.release }}
        run: printf '%s\n' "$OTA_RELEASE_JSON" > ota-release-state.json

      - name: Upload OTA release state
        if: always() && hashFiles('ota-update.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ota-release-state
          overwrite: true
          path: |
            ota-release-state.json
            ota-update.json
          if-no-files-found: error

  bundled-release:
    name: Build and finalize OTA, APK and IPA
    needs: publish
    uses: ./.github/workflows/mobile-release.yml
    with:
      release_type: ${{ inputs.channel }}
      release_notes: ${{ inputs.message }}
      source_sha: ${{ github.sha }}
      ota_runtime_version: ${{ needs.publish.outputs.runtime_version }}
      update_url: ${{ needs.publish.outputs.update_url }}
      publication_mode: ${{ inputs.publication_mode }}
      ota_release_json: ${{ needs.publish.outputs.ota_release_json }}
      ota_bundle: true
    secrets: inherit
