name: EAS Hot Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update channel'
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      message:
        description: 'Update message'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eas-hot-update-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ vars.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      EXPO_UPDATE_CHANNEL: ${{ inputs.channel }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo 'EAS updates must be dispatched from the main branch.'
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Configure update channel
        shell: bash
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo 'EXPO_TOKEN is not configured.'
            exit 1
          fi
          if [[ -z "$EXPO_PROJECT_ID" ]]; then
            echo 'EXPO_PROJECT_ID is not configured.'
            exit 1
          fi

          if [[ "$EXPO_UPDATE_CHANNEL" == "preview" ]]; then
            manifest_path='docs/releases/preview.json'
          else
            manifest_path='docs/releases/latest.json'
          fi

          if [[ ! -f "$manifest_path" ]]; then
            echo "No released APK manifest exists for channel $EXPO_UPDATE_CHANNEL: $manifest_path"
            echo 'Publish the matching full APK before publishing a hot update.'
            exit 1
          fi

          app_version="$(npx expo config --type public --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version));')"
          released_version="$(node -e 'const fs = require("fs"); const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(manifest.version ?? ""));' "$manifest_path")"
          released_display_version="$(node -e 'const fs = require("fs"); const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(manifest.displayVersion ?? manifest.version ?? ""));' "$manifest_path")"
          if [[ "$app_version" != "$released_version" ]]; then
            echo "Hot update runtime version $app_version does not match the latest $EXPO_UPDATE_CHANNEL APK version $released_version."
            echo 'Publish the matching full APK or restore app.config.ts version before publishing a hot update.'
            exit 1
          fi

          echo "EAS_ENVIRONMENT=$EXPO_UPDATE_CHANNEL" >> "$GITHUB_ENV"
          echo "APP_NATIVE_VERSION=$released_display_version" >> "$GITHUB_ENV"
          echo "Publishing Android runtime=$app_version, displayVersion=$released_display_version to channel=$EXPO_UPDATE_CHANNEL"

      - name: Validate Expo update config
        shell: bash
        run: |
          npx expo config --type public --json | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const config = JSON.parse(input);
              const expectedChannel = process.env.EXPO_UPDATE_CHANNEL;
              const actualChannel = config.updates?.requestHeaders?.["expo-channel-name"];
              const configuredChannel = config.extra?.updateChannel;
              const appUpdatesEnabled = config.extra?.appUpdatesEnabled;
              const manifestUrl = config.extra?.binaryUpdateManifestUrl;
              if (!config.updates?.url) throw new Error("Expo updates.url is missing");
              if (config.updates?.enabled !== true) throw new Error("Expo updates are disabled");
              if (actualChannel !== expectedChannel) throw new Error(`Expected update channel ${expectedChannel}, got ${actualChannel}`);
              if (configuredChannel !== expectedChannel) throw new Error(`Expected configured channel ${expectedChannel}, got ${configuredChannel}`);
              if (appUpdatesEnabled !== true) throw new Error("App update checks are disabled");
              if (expectedChannel === "preview" && !manifestUrl?.endsWith("/docs/releases/preview.json")) {
                throw new Error(`Preview build uses an invalid binary manifest: ${manifestUrl}`);
              }
              if (expectedChannel === "production" && manifestUrl?.endsWith("/docs/releases/preview.json")) {
                throw new Error(`Production build uses the preview binary manifest: ${manifestUrl}`);
              }
            });
          '

      - name: Publish EAS Update
        run: npx eas-cli@21.8.0 update --channel "$EXPO_UPDATE_CHANNEL" --environment "$EAS_ENVIRONMENT" --platform android --message "$INPUT_MESSAGE" --non-interactive
        env:
          INPUT_MESSAGE: ${{ inputs.message }}
