<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fb7299" />
    <title>导入巡礼计划 · Anitabi</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff8fa;
        color: #292126;
      }
      main {
        width: min(88vw, 420px);
        padding: 32px 24px;
        border-radius: 24px;
        background: white;
        box-shadow: 0 16px 50px rgba(114, 45, 69, 0.12);
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: #fce8ee;
        color: #fb7299;
        font-size: 34px;
        font-weight: 800;
      }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0 0 24px; color: #74676e; line-height: 1.6; }
      a {
        display: block;
        padding: 13px 18px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
      }
      #open { background: #fb7299; color: white; }
      #download { margin-top: 10px; background: #f7edf0; color: #604f57; }
      #error { display: none; color: #b42318; }
      @media (prefers-color-scheme: dark) {
        body { background: #171315; color: #fff7fa; }
        main { background: #241e21; box-shadow: none; }
        p { color: #c8b9c0; }
        #download { background: #352c31; color: #f7e8ee; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">A</div>
      <h1>在 Anitabi 中导入</h1>
      <p id="message">正在尝试打开 Anitabi。若没有自动跳转，请点击下面的按钮。</p>
      <p id="error">这个巡礼计划链接不完整，无法导入。</p>
      <a id="open" href="#">打开 Anitabi</a>
      <a id="download" href="https://github.com/boiboif/anitabi-app/releases">下载 Anitabi</a>
    </main>
    <script>
      const payload = location.hash.replace(/^#(?:p=)?/, '');
      const openButton = document.querySelector('#open');
      if (!payload || !/^[A-Za-z0-9_-]+$/.test(payload)) {
        document.querySelector('#message').style.display = 'none';
        document.querySelector('#error').style.display = 'block';
        openButton.style.display = 'none';
      } else {
        const appUrl = `anitabiapp://plans/import?data=${encodeURIComponent(payload)}`;
        openButton.href = appUrl;
        window.setTimeout(() => { window.location.href = appUrl; }, 180);
      }
    </script>
  </body>
</html>
