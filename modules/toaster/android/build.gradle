plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.toaster'
version = '0.7.6'

android {
  namespace "expo.modules.toaster"
  defaultConfig {
    versionCode 1
    versionName "0.7.6"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // getActivity/Toaster (JitPack)
  // README: implementation 'com.github.getActivity:Toaster:13.8'
  implementation "com.github.getActivity:Toaster:13.8"
}
